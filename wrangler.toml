name = "escenarios-btc"
main = "src/worker/index.ts"
routes = [{ pattern = "btc.bodyboardincartago.com", custom_domain = true }]
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Web estática (generada por Vite en dist/). El Worker atiende /api/* y el resto lo sirve Assets.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/entrar"]

# Un único cron cada 5 minutos: el Worker reparte el trabajo por turnos (cabe en el plan gratuito,
# que permite 5 crons por cuenta, 50 subpeticiones y 10 ms de CPU por ejecución).
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "escenarios-btc"
database_id = "73a25e43-2746-4bb6-8efe-b77c0a4c75e8"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "b2c1064885a94da792ba2703d9527546"

# Workers AI: clasificación y embeddings de noticias (plan gratuito: 10.000 neuronas/día).
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
# "publico": todo visible sin cuenta; los usuarios asignados guardan escenarios y los admin gestionan.
# "privado": solo los usuarios asignados ven la web.
# "suscripcion": alta libre con prueba gratuita de TRIAL_DAYS días; después, pago anual (PRICE_EUR) por PayPal.
ACCESS_MODE = "suscripcion"
TRIAL_DAYS = "30"
PRICE_EUR = "10"
PAYPAL_USER = "garavide"
PAYPAL_LINK = "https://www.paypal.com/qrcodes/p2pqrc/PKJX9NY49UAXS"
# Envío como «Amigos y familiares» con esta nota (petición del propietario)
PAYPAL_NOTE = "regalo familiar"
# Emails con rol admin desde el primer despliegue (separados por comas).
ADMIN_EMAILS = "valemartinez.jacobo@gmail.com"
# Equipo de Cloudflare Access (ej. "miequipo" para miequipo.cloudflareaccess.com) y AUD de la aplicación.
ACCESS_TEAM = "garavide"
ACCESS_AUD = "7abf3cd6d8174e0abe144040b15332802f0ceddf69b74851197cdb4fd3c906fd"
# Fuentes con licencia solo no comercial: "off" mientras la web lleve publicidad.
NONCOMMERCIAL_SOURCES = "off"
ADS_ENABLED = "false"
# Identificación ante SEC EDGAR (exige un User-Agent con contacto).
CONTACT_UA = "HorizonteBTC (contacto: valemartinez.jacobo@gmail.com)"

# Secrets (wrangler secret put NOMBRE): FRED_API_KEY, COINGECKO_API_KEY, CF_RADAR_TOKEN,
# CONGRESS_API_KEY, GUARDIAN_API_KEY, PUBLISH_TOKEN
